<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abhira Insights - Bihar Board Class 12 English Grammar Quiz</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1e3c72, #2a5298);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .quiz-container {
            background: #ffffff;
            width: 100%;
            max-width: 650px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        .logo-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }

        .logo-header img {
            width: 90px;
            height: 90px;
            object-fit: contain;
            border-radius: 50%;
            margin-bottom: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            background: #fff;
            padding: 5px;
        }

        h1 {
            text-align: center;
            color: #2a5298;
            font-size: 24px;
            margin-bottom: 5px;
        }

        h2 {
            text-align: center;
            color: #555;
            font-size: 16px;
            margin-bottom: 20px;
        }

        #progress-container {
            font-size: 14px;
            color: #888;
            margin-bottom: 10px;
            font-weight: bold;
        }

        #question-text {
            font-size: 18px;
            color: #333;
            margin-bottom: 20px;
            font-weight: 600;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-btn {
            background: #f8f9fa;
            border: 2px solid #dee2e6;
            padding: 12px 18px;
            border-radius: 8px;
            text-align: left;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .option-btn:hover:not(:disabled) {
            background: #e9ecef;
            border-color: #adb5bd;
        }

        .option-btn.correct {
            background: #d4edda !important;
            border-color: #28a745 !important;
            color: #155724;
        }

        .option-btn.wrong {
            background: #f8d7da !important;
            border-color: #dc3545 !important;
            color: #721c24;
        }

        #explanation-box {
            margin-top: 20px;
            padding: 15px;
            background: #e2f0d9;
            border-left: 5px solid #28a745;
            border-radius: 5px;
        }

        #explanation-box h3 {
            font-size: 15px;
            color: #2b542c;
            margin-bottom: 5px;
        }

        #explanation-text {
            font-size: 14px;
            color: #333;
        }

        #next-btn {
            margin-top: 20px;
            width: 100%;
            background: #007bff;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        #next-btn:hover {
            background: #0056b3;
        }

        .hidden {
            display: none !important;
        }

        #result-box {
            text-align: center;
        }

        #result-box h2 {
            color: #28a745;
            font-size: 26px;
            margin-bottom: 15px;
        }

        #result-box p {
            font-size: 18px;
            margin-bottom: 20px;
        }

        #result-box button {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 25px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>

                explanation: "'Beautiful' ki sahi spelling b-e-a-u-t-i-f-u-l hai."
            },
            {
                question: "Solution for: Who wrote this book?",
                options: [
                    "Who was this book written?",
                    "By whom was this book written?",
                    "Who is written this book?",
                    "Whom was written this book?"
                ],
                answer: 1,
                explanation: "'Who' se shuru hone wale active sentence ka passive 'By whom + was/were + object + V3' banta hai."
            },
            {
                question: "Choose the correct option: Each of the boys ____ given a prize.",
                options: ["were", "was", "have", "are"],
                answer: 1,
                explanation: "'Each of' ke baad noun plural hota hai lekin verb hamesha singular ('was') hota hai."
            },
            {
                question: "Choose the correct antonym of 'Friend':",
                options: ["Enemy", "Foe", "Both A and B", "Companion"],
                answer: 2,
                explanation: "'Friend' (dost) ke antonyms 'Enemy' aur 'Foe' dono hote hain."
            },
            {
                question: "Choose the correct option: Knowledge ____ a powerful thing.",
                options: ["are", "were", "is", "have"],
                answer: 2,
                explanation: "'Knowledge' ek uncountable noun hai, isliye iske sath singular verb 'is' ka prayog hota hai."
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;

        const questionNumberEl = document.getElementById("question-number");
        const questionTextEl = document.getElementById("question-text");
        const optionsContainerEl = document.getElementById("options-container");
        const explanationBoxEl = document.getElementById("explanation-box");
        const explanationTextEl = document.getElementById("explanation-text");
        const nextBtnEl = document.getElementById("next-btn");
        const quizBoxEl = document.getElementById("quiz-box");
        const resultBoxEl = document.getElementById("result-box");
        const scoreTextEl = document.getElementById("score-text");

        function loadQuestion() {
            explanationBoxEl.classList.add("hidden");
            nextBtnEl.classList.add("hidden");
            
            let currentQ = quizData[currentQuestionIndex];
            questionNumberEl.innerText = `Question ${currentQuestionIndex + 1} of ${quizData.length}`;
            questionTextEl.innerText = currentQ.question;
            
            optionsContainerEl.innerHTML = "";
            
            currentQ.options.forEach((option, index) => {
                const button = document.createElement("button");
                button.innerText = option;
                button.classList.Aside = "";
                button.classList.add("option-btn");
                button.addEventListener("click", () => selectAnswer(index, button));
                optionsContainerEl.appendChild(button);
            });
        }

        function selectAnswer(selectedIndex, selectedButton) {
            let currentQ = quizData[currentQuestionIndex];
            const allButtons = optionsContainerEl.querySelectorAll(".option-btn");
            
            allButtons.forEach(btn => btn.disabled = true);
            
            if (selectedIndex === currentQ.answer) {
                selectedButton.classList.add("correct");
                selectedButton.innerHTML += " ✓ (Sahi Jawab)";
                score++;
            } else {
                selectedButton.classList.add("wrong");
                selectedButton.innerHTML += " ✗ (Galat Jawab)";
                allButtons[currentQ.answer].classList.add("correct");
                allButtons[currentQ.answer].innerHTML += " ✓";
            }
            
            explanationTextEl.innerText = currentQ.explanation;
            explanationBoxEl.classList.remove("hidden");
            
            if (currentQuestionIndex < quizData.length - 1) {
                nextBtnEl.innerText = "Next Question";
            } else {
                nextBtnEl.innerText, nextBtnEl.innerText = "View Result";
            }
            nextBtnEl.classList.remove("hidden");
        }

        nextBtnEl.addEventListener("click", () => {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuestion();
            } else {
                showResult();
            }
        });

        function showResult() {
            quizBoxEl.classList.add("hidden");
            resultBoxEl.classList.remove("hidden");
            scoreTextEl.innerText = `Aapne 25 me se ${score} questions ke sahi jawab diye hain!`;
        }

        loadQuestion();
    </script>
</body>
</html>
