<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bihar Board 12th Hindi Vyakaran MCQ - Abhira Insights</title>
    <!-- Google Fonts for Attractive Typography -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-color: #0f172a;
            --accent-blue: #0284c7;
            --accent-orange: #f97316;
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            --card-bg: #ffffff;
            --text-main: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: var(--bg-gradient);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: var(--card-bg);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        header {
            background: linear-gradient(135deg, #090d16 0%, #1e293b 100%);
            color: #ffffff;
            padding: 30px 20px;
            text-align: center;
            position: relative;
            border-bottom: 4px solid var(--accent-orange);
        }

        /* Branding Styles - Logo Removed, Text Centered as Heading */
        .brand-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 12px;
        }

        .brand-title {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 1.5px;
            background: linear-gradient(90deg, #38bdf8, #fb923c, #f43f5e, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
            margin-bottom: 8px;
        }

        header h1 {
            font-size: 19px;
            font-weight: 600;
            color: #e2e8f0;
            margin-top: 5px;
        }

        .quiz-body {
            padding: 30px;
        }

        .progress-bar-container {
            width: 100%;
            background: #e2e8f0;
            border-radius: 10px;
            height: 10px;
            margin-bottom: 25px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-blue), var(--accent-orange));
            transition: width 0.4s ease;
        }

        .question-card {
            display: none;
        }

        .question-card.active {
            display: block;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-number {
            font-size: 14px;
            font-weight: 600;
            color: var(--accent-orange);
            text-transform: uppercase;
            margin-bottom: 8px;
            letter-spacing: 0.5px;
        }

        .question-text {
            font-size: 18px;
            font-weight: 600;
            color: var(--primary-color);
            margin-bottom: 20px;
            line-height: 1.5;
        }

        .options-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-item {
            padding: 14px 18px;
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 500;
            color: #475569;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
        }

        .option-item:hover {
            background: #f1f5f9;
            border-color: var(--accent-blue);
            color: var(--primary-color);
        }

        .option-item.correct {
            background: #dcfce7;
            border-color: #22c55e;
            color: #15803d;
        }

        .option-item.incorrect {
            background: #fee2e2;
            border-color: #ef4444;
            color: #b91c1c;
        }

        .btn-container {
            margin-top: 25px;
            display: flex;
            justify-content: flex-end;
        }

        .next-btn {
            background: linear-gradient(135deg, var(--accent-blue), #0369a1);
            color: white;
            border: none;
            padding: 12px 28px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(2, 132, 199, 0.3);
            transition: all 0.2s ease;
            display: none;
        }

        .next-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        /* Scorecard Section */
        .score-card {
            text-align: center;
            display: none;
            padding: 20px;
        }

        .score-card h2 {
            font-size: 28px;
            color: var(--primary-color);
            margin-bottom: 15px;
        }

        .score-badge {
            font-size: 48px;
            font-weight: 700;
            color: var(--accent-orange);
            margin: 20px 0;
        }

        .score-message {
            font-size: 16px;
            color: #64748b;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .restart-btn {
            background: linear-gradient(135deg, var(--accent-orange), #ea580c);
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 10px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(249, 115, 22, 0.3);
            transition: all 0.2s ease;
        }

        .restart-btn:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 15px;
            font-size: 13px;
            color: #cbd5e1;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand-container">
                <!-- Logo element successfully removed and Abhira Insights set as heading -->
                <div class="brand-title">Abhira Insights</div>
            </div>
            <h1>बिहार बोर्ड 12th - हिंदी व्याकरण महा-क्विज़ (MCQ)</h1>
        </header>

        <div class="quiz-body">
            <div class="progress-bar-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div id="quizContainer">
                <!-- Questions will be injected dynamically via JavaScript -->
            </div>

            <div class="score-card" id="scoreCard">
                <h2>टेस्ट समाप्त हुआ!</h2>
                <div class="score-badge" id="scoreBadge">0/20</div>
                <p class="score-message" id="scoreMessage">बधाई हो! आपने सफलतापूर्वक टेस्ट पूरा कर लिया है।</p>
                <button class="restart-btn" onclick="restartQuiz()">दुबारा प्रयास करें</button>
            </div>

            <div class="btn-container">
                <button class="next-btn" id="nextBtn" onclick="nextQuestion()">अगला प्रश्न</button>
            </div>
        </div>
    </div>

    <footer>
        &copy; 2026 Abhira Insights. All Rights Reserved.
    </footer>

    <script>
        const quizData = [
            {
                question: "‘नयन’ शब्द का संधि-विच्छेद क्या है?",
                options: ["ने + अन", "नै + अन", "नी + अन", "न + यन"],
                correct: 1
            },
            {
                question: "‘स्वागत’ शब्द का सही संधि-विच्छेद क्या है?",
                options: ["सु + आगत", "स्वा + गत", "स्व + आगत", "सू + आगत"],
                correct: 0
            },
            {
                question: "‘रात-दिन’ किस समास का उदाहरण है?",
                options: ["तत्पुरुष समास", "द्वंद्व समास", "कर्मधारय समास", "बहुब्रीहि समास"],
                correct: 1
            },
            {
                question: "‘कमल’ का पर्यायवाची शब्द निम्नलिखित में से कौन सा है?",
                options: ["जलद", "पयोधर", "सरोज", "नीरद"],
                correct: 2
            },
            {
                question: "‘जो सब कुछ जानता हो’ - इसके लिए एक शब्द क्या होगा?",
                options: ["अल्पज्ञ", "सर्वज्ञ", "विद्वान", "ज्ञानी"],
                correct: 1
            },
            {
                question: "‘पवन’ शब्द का संधि-विच्छेद क्या है?",
                options: ["पो + अन", "पौ + अन", "पा + वन", "प + वन"],
                correct: 0
            },
            {
                question: "‘गजानन’ किस समास का उदाहरण है?",
                options: ["कर्मधारय समास", "द्वंद्व समास", "बहुब्रीहि समास", "तत्पुरुष समास"],
                correct: 2
            },
            {
                question: "‘इत्यादि’ शब्द का संधि-विच्छेद क्या है?",
                options: ["इति + आदि", "इत् + आदि", "इत्या + दि", "इति + दि"],
                correct: 0
            },
            {
                question: "‘अकथनीय’ शब्द के लिए सही वाक्यांश क्या है?",
                options: ["जो कहा न जा सके", "जो कभी न मरे", "जो सब कुछ जनता हो", "जिसका कोई अंत न हो"],
                correct: 0
            },
            {
                question: "‘प्रेमसागर’ किस समास का उदाहरण है?",
                options: ["तत्पुरुष समास", "अव्ययीभाव समास", "द्वंद्व समास", "कर्मधारय समास"],
                correct: 0
            },
            {
                question: "‘सज्जन’ का सही संधि-विच्छेद क्या है?",
                options: ["सत् + जन", "सज + जन", "स + जन", "सत्य + जन"],
                correct: 0
            },
            {
                question: "‘पीताम्बर’ में कौन सा समास है?",
                options: ["द्वंद्व", "बहुब्रीहि", "अव्ययीभाव", "द्विगु"],
                correct: 1
            },
            {
                question: "‘आकाश’ का पर्यायवाची शब्द निम्नलिखित में से कौन सा है?",
                options: ["पाताल", "व्योम", "भूमि", "धरणि"],
                correct: 1
            },
            {
                question: "‘जिसका कोई शत्रु न हो’ - उसके लिए एक शब्द क्या है?",
                options: ["अजातशत्रु", "निर्लज्ज", "मित्रहीन", "अजेय"],
                correct: 0
            },
            {
                question: "‘यथाशक्ति’ में कौन सा समास है?",
                options: ["तत्पुरुष", "अव्ययीभाव", "कर्मधारय", "बहुब्रीहि"],
                correct: 1
            },
            {
                question: "‘कमलनयन’ में कौन सा समास है?",
                options: ["कर्मधारय", "द्वंद्व", "तत्पुरुष", "द्विगु"],
                correct: 0
            },
            {
                question: "‘स्वागत’ में कौन सी संधि है?",
                options: ["गुण संधि", "दीर्घ संधि", "यण संधि", "अदि संधि"],
                correct: 2
            },
            {
                question: "‘उन्नति’ का सही संधि-विच्छेद क्या है?",
                options: ["उत् + नति", "उद् + नति", "उन्न + ति", "उत + नति"],
                correct: 0
            },
            {
                question: "‘पंचवटी’ में कौन सा समास है?",
                options: ["द्विगु समास", "द्वंद्व समास", "बहुब्रीहि समास", "कर्मधारय समास"],
                correct: 0
            },
            {
                question: "‘अन्वेषण’ का सही संधि-विच्छेद क्या है?",
                options: ["अनु + एषण", "अनु + वेषण", "अन् + वेषण", "अन + एषण"],
                correct: 0
            }
        ];

        let currentQuestionIndex = 0;
        let score = 0;
        let answerSelected = false;

        const quizContainer = document.getElementById("quizContainer");
        const nextBtn = document.getElementById("nextBtn");
        const progressBar = document.getElementById("progressBar");
        const scoreCard = document.getElementById("scoreCard");
        const scoreBadge = document.getElementById("scoreBadge");
        const scoreMessage = document.getElementById("scoreMessage");

        function loadQuiz() {
            quizContainer.innerHTML = "";
            answerSelected = false;
            nextBtn.style.display = "none";

            const currentQuiz = quizData[currentQuestionIndex];
            updateProgress();

            const card = document.createElement("div");
            card.classList.add("question-card", "active");

            let optionsHTML = "";
            currentQuiz.options.forEach((option, index) => {
                optionsHTML += `<li class="option-item" onclick="selectOption(this, ${index})">${option}</li>`;
            });

            card.innerHTML = `
                <div class="question-number">प्रश्न ${currentQuestionIndex + 1} / ${quizData.length}</div>
                <div class="question-text">${currentQuiz.question}</div>
                <ul class="options-list">${optionsHTML}</ul>
            `;

            quizContainer.appendChild(card);
        }

        function selectOption(element, index) {
            if (answerSelected) return;
            answerSelected = true;

            const currentQuiz = quizData[currentQuestionIndex];
            const options = document.querySelectorAll(".option-item");

            if (index === currentQuiz.correct) {
                element.classList.add("correct");
                score++;
            } else {
                element.classList.add("incorrect");
                options[currentQuiz.correct].classList.add("correct");
            }

            options.forEach(opt => opt.style.pointerEvents = "none");
            nextBtn.style.display = "block";
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < quizData.length) {
                loadQuiz();
            } else {
                showScore();
            }
        }

        function updateProgress() {
            const progressPercentage = ((currentQuestionIndex) / quizData.length) * 100;
            progressBar.style.width = progressPercentage + "%";
        }

        function showScore() {
            quizContainer.style.display = "none";
            document.querySelector(".progress-bar-container").style.display = "none";
            nextBtn.style.display = "none";
            scoreCard.style.display = "block";
            progressBar.style.width = "100%";

            scoreBadge.innerText = `${score} / ${quizData.length}`;
            
            if (score === quizData.length) {
                scoreMessage.innerText = "अति उत्तम! आपकी तैयारी बहुत ही शानदार है।";
            } else if (score >= 12) {
                scoreMessage.innerText = "अच्छा प्रयास! थोड़ी और मेहनत से आप और बेहतर कर सकते हैं।";
            } else {
                scoreMessage.innerText = "आपको हिंदी व्याकरण की और तैयारी करने की आवश्यकता है।";
            }
        }

        function restartQuiz() {
            currentQuestionIndex = 0;
            score = 0;
            quizContainer.style.display = "block";
            document.querySelector(".progress-bar-container").style.display = "block";
            scoreCard.style.display = "none";
            loadQuiz();
        }

        loadQuiz();
    </script>
</body>
</html>
